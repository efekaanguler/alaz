autoware_behavior_path_planner:
  ros__parameters:
    traffic_light_signal_timeout: 1.0
    wheel_radius: 0.33
    wheel_width: 0.18
    wheel_base: 2.7
    wheel_tread: 1.55
    front_overhang: 0.9
    rear_overhang: 1.0
    left_overhang: 0.1
    right_overhang: 0.1
    vehicle_height: 1.7
    max_steer_angle: 0.61
    backward_path_length: 5.0
    forward_path_length: 100.0
    input_path_interval: 0.2
    output_path_interval: 0.2
    max_acc: 2.0
    min_acc: -3.0
    normal.max_acc: 2.0
    normal.min_acc: -3.0
    max_vel: 20.0
    backward_length_buffer_for_end_of_pull_over: 5.0
    backward_length_buffer_for_end_of_pull_out: 5.0
    minimum_pull_over_length: 15.0
    refine_goal_search_radius_range: 7.5
    turn_signal_intersection_search_distance: 30.0
    turn_signal_intersection_angle_threshold_deg: 15.0
    turn_signal_minimum_search_distance: 10.0
    turn_signal_search_time: 3.0
    turn_signal_shift_length_threshold: 1.0
    turn_signal_remaining_shift_length_threshold: 0.5
    turn_signal_remaining_distance_to_bound_threshold: 10.0
    turn_signal_on_swerving: true
    turn_signal_roundabout_on_entry: "true"
    turn_signal_roundabout_on_exit: "true"
    turn_signal_roundabout_entry_indicator_persistence: true
    turn_signal_roundabout_search_distance: 30.0
    turn_signal_roundabout_angle_threshold_deg: 15.0  # EKLENDİ

velocity_smoother:
  ros__parameters:
    wheel_radius: 0.33
    wheel_width: 0.18
    wheel_base: 2.7
    wheel_tread: 1.55
    front_overhang: 0.9
    rear_overhang: 1.0
    left_overhang: 0.1
    right_overhang: 0.1
    vehicle_height: 1.7
    max_steer_angle: 0.61
    enable_lateral_acc_limit: true
    enable_steering_rate_limit: true
    enable_jerk_filter: true
    nominal.jerk: 0.5
    nominal.acc: 1.0
    max_vel: 20.0
    max_jerk: 1.0
    min_jerk: -1.0
    max_accel: 2.0
    min_decel: -3.0
    margin_to_insert_external_velocity_limit: 0.3
    replan_vel_deviation: 5.0
    engage_velocity: 0.25
    engage_acceleration: 0.1
    engage_exit_ratio: 0.5
    stopping_velocity: 0.1
    stopping_distance: 0.0
    extract_ahead_dist: 200.0
    extract_behind_dist: 5.0
    stop_dist_to_prohibit_engage: 1.0
    ego_nearest_dist_threshold: 3.0
    ego_nearest_yaw_threshold: 1.57
    post_max_trajectory_length: 50.0
    post_min_trajectory_length: 10.0
    post_resample_time: 0.1
    post_dense_resample_dt: 0.1
    post_dense_min_interval_distance: 0.1
    post_sparse_resample_dt: 0.3
    post_sparse_min_interval_distance: 0.5
    algorithm_type: "JerkFiltered"  # EKLENDİ