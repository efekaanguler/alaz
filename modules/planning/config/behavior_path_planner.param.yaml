/**:
  ros__parameters:
    launch_modules: []
    wheel_radius: 0.2916
    wheel_width: 0.175
    wheel_base: 1.55
    wheel_tread: 1.40
    front_overhang: 0.80
    rear_overhang: 0.85
    left_overhang: 0.0875
    right_overhang: 0.0875
    vehicle_height: 1.5
    max_steer_angle: 0.5236

    traffic_light_signal_timeout: 1.0

    planning_hz: 10.0
    
    # Module manager parameters (replaces old launch_modules)
    slots:
      - slot1
      - slot2
      - slot3
      - slot4
    slot1: ["autoware_behavior_path_planner::StartPlannerModule"]
    slot2: [
      "autoware_behavior_path_planner::SideShiftModule",
      "autoware_behavior_path_planner::AvoidanceByLaneChangeModule",
      "autoware_behavior_path_planner::StaticObstacleAvoidanceModule",
      "autoware_behavior_path_planner::LaneChangeLeftModule",
      "autoware_behavior_path_planner::LaneChangeRightModule"
    ]
    slot3: ["autoware_behavior_path_planner::GoalPlannerModule"]
    slot4: ["autoware_behavior_path_planner::DynamicObstacleAvoidanceModule"]

    external_request_lane_change_left:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: true

    external_request_lane_change_right:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: true

    lane_change_left:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    lane_change_right:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    start_planner:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: false

    side_shift:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false

    goal_planner:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: false

    static_obstacle_avoidance:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: false

    avoidance_by_lane_change:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false

    dynamic_obstacle_avoidance:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    sampling_planner:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false
    backward_path_length: 5.0
    forward_path_length: 300.0
    backward_length_buffer_for_end_of_pull_over: 5.0
    backward_length_buffer_for_end_of_pull_out: 5.0
    minimum_pull_over_length: 16.0

    refine_goal_search_radius_range: 7.5

    # parameters for turn signal decider
    turn_signal_intersection_search_distance: 30.0
    turn_signal_intersection_angle_threshold_deg: 15.0
    turn_signal_roundabout_on_entry: "None" # "None", "Left", "Right"
    turn_signal_roundabout_entry_indicator_persistence: false
    turn_signal_roundabout_on_exit: "Left" # "None", "Left", "Right",
    turn_signal_roundabout_search_distance: 30.0
    turn_signal_roundabout_angle_threshold_deg: 15.0
    turn_signal_roundabout_backward_depth: 50
    turn_signal_minimum_search_distance: 10.0
    turn_signal_search_time: 3.0
    turn_signal_shift_length_threshold: 0.3
    turn_signal_remaining_shift_length_threshold: 0.1
    turn_signal_remaining_distance_to_bound_threshold: 1.3 # Distance from ego vehicle's front edge to the far-side boundary of the target merging lane. The turn signal will be turned off when the value is less than the threshold.
    turn_signal_on_swerving: true

    enable_akima_spline_first: false
    enable_cog_on_centerline: false
    input_path_interval: 2.0
    output_path_interval: 2.0
    drivable_area_left_bound_offset: 0.0
    drivable_area_right_bound_offset: 0.0
    drivable_area_types_to_skip: ["__none__"]
    dynamic_expansion.enabled: false
    dynamic_expansion.print_runtime: false
    dynamic_expansion.max_expansion_distance: 0.0
    dynamic_expansion.min_bound_interval: 0.1
    dynamic_expansion.ego.extra_front_overhang: 0.0
    dynamic_expansion.ego.extra_rear_overhang: 0.0
    dynamic_expansion.ego.extra_left_overhang: 0.0
    dynamic_expansion.ego.extra_right_overhang: 0.0
    dynamic_expansion.ego.extra_wheelbase: 0.0
    dynamic_expansion.ego.extra_wheel_tread: 0.0
    dynamic_expansion.ego.extra_wheel_radius: 0.0
    dynamic_expansion.ego.extra_width: 0.0
    dynamic_expansion.ego.extra_length: 0.0
    dynamic_expansion.ego.extra_height: 0.0
    dynamic_expansion.smoothing.enabled: false
    dynamic_expansion.smoothing.curvature_average_window: 3
    dynamic_expansion.smoothing.arc_length_range: 20.0
    dynamic_expansion.smoothing.max_bound_rate: 0.2
    dynamic_expansion.smoothing.path_filter_moving_ave_num: 3
    dynamic_expansion.smoothing.endpoint_path_smoothing_num: 3
    dynamic_expansion.smoothing.curvature_threshold: 0.01
    dynamic_expansion.path_preprocessing.max_arc_length: 200.0
    dynamic_expansion.path_preprocessing.resample_interval: 1.0
    dynamic_expansion.path_preprocessing.num_of_extra_points: 0
    dynamic_expansion.path_preprocessing.reuse_max_deviation: 0.5
    dynamic_expansion.object_exclusion.exclude_static: true
    dynamic_expansion.object_exclusion.exclude_dynamic: false
    dynamic_expansion.object_exclusion.ignore_objects_within_ego_path: true
    dynamic_expansion.object_exclusion.object_check_backward_distance: 0.0
    dynamic_expansion.object_exclusion.th_stopped_object_velocity: 0.1
    dynamic_expansion.object_exclusion.safety_margin.front: 0.0
    dynamic_expansion.object_exclusion.safety_margin.rear: 0.0
    dynamic_expansion.object_exclusion.safety_margin.left: 0.0
    dynamic_expansion.object_exclusion.safety_margin.right: 0.0
    dynamic_expansion.avoid_linestring.types: ["__none__"]
    dynamic_expansion.avoid_linestring.distance: 0.0
    dynamic_expansion.avoid_linestring.object_buffer: 0.0

    normal.max_acc: 2.0
    normal.min_acc: -3.0
    max_vel: 20.0
    ego_nearest_dist_threshold: 3.0
    ego_nearest_yaw_threshold: 1.57
