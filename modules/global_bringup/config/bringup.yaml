packages:
  rdw_vehicle_launch:
    enabled: true
    launch_file: "vehicle.launch.xml"
    arguments:
      software_test_mode: "false"
  
  ros2_can_bridge:
    enabled: true
    launch_file: "ros2_can_bridge.launch.py"
  
  rdw_sensor_kit_launch:
    enabled: true
    launch_file: "sensing.launch.xml"

  odometry:
    enabled: true
    launch_file: "my_odom.launch.xml"
    arguments:
      publish_tf: "false"

  alaz_lidar_clustering:
    enabled: true
    launch_file: "lidar_clustering.launch.xml"
  
  localization:
    enabled: true
    launch_file: "localization.launch.py"
    arguments:
      src_image: "/sensing/image_raw"
      src_info: "/sensing/camera_info"
      vehicle_model: "rdw_vehicle"
      pose_source: "yabloc"
      twist_source: "external"
      data_path: "/autoware_data"

  perception:
    enabled: true
    launch_file: "perception.launch.xml"
    arguments:
      image_topic: "/sensing/image_raw"
      inference_device: "auto"
      enable_object_tracking: "true"

  planning:
    enabled: true
    launch_file: "planning.launch.py"
    arguments:
      vehicle_model: "rdw_vehicle"
      enable_all_modules_auto_mode: "true"
    
  control:
    enabled: true
    launch_file: "control.launch.py"
    arguments:
      vehicle_model: "rdw_vehicle"
      enable_safety_checks: "true"
    
  mission_control:
    enabled: true
    launch_file: "mission_control.launch.xml"
