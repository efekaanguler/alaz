name: ROS 2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y python3-pip python3-pytest
          rosdep update
          rosdep install --from-paths modules --ignore-src -y --rosdistro humble \
            --skip-keys "camera_description autoware_mpc_lateral_controller tier4_perception_msgs python-can autoware_pointcloud_preprocessor autoware_trajectory_follower_node"

      - name: Build workspace
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --base-paths modules --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --packages-skip control planning

      - name: Run tests
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test --base-paths modules --packages-skip control planning
          colcon test-result --all --verbose
